name: hyperpulse-reaction-map

services:
  reaction-map:
    build:
      context: .
      dockerfile: workers/reaction-map/Dockerfile
    image: hyperpulse-reaction-map:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:?Set NEON_DATABASE_URL to the direct Neon Postgres connection string}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:?Set NEON_DATABASE_URL_POOLING to the pooled Neon Postgres connection string}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_URL: ${POSTGRES_URL:-}
      HYPERPULSE_NETWORK: ${HYPERPULSE_NETWORK:-mainnet}
      REACTION_MAP_ASSETS: ${REACTION_MAP_ASSETS:-BTC,ETH,SOL,HYPE,ZEC,TON,SUI,DOGE}
      REACTION_MAP_BUCKET_MS: ${REACTION_MAP_BUCKET_MS:-120000}
      REACTION_MAP_FLUSH_MS: ${REACTION_MAP_FLUSH_MS:-300000}
      REACTION_MAP_PROMOTE_MS: ${REACTION_MAP_PROMOTE_MS:-300000}
      REACTION_MAP_BOOK_FLUSH_BATCH_SIZE: ${REACTION_MAP_BOOK_FLUSH_BATCH_SIZE:-400}
      REACTION_MAP_BOOK_LEVEL_LIMIT: ${REACTION_MAP_BOOK_LEVEL_LIMIT:-12}
      REACTION_MAP_WIDE_BOOK_N_SIG_FIGS: ${REACTION_MAP_WIDE_BOOK_N_SIG_FIGS:-3}
      REACTION_MAP_ZONE_WINDOWS: ${REACTION_MAP_ZONE_WINDOWS:-15m,1h}
      REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT: ${REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT:-0.25}
      REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD: ${REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD:-250000}
      REACTION_MAP_CLEANUP_RANGE_MIN_PCT: ${REACTION_MAP_CLEANUP_RANGE_MIN_PCT:-12}
      REACTION_MAP_CLEANUP_RANGE_MAX_PCT: ${REACTION_MAP_CLEANUP_RANGE_MAX_PCT:-45}
      REACTION_MAP_CLEANUP_RANGE_STDEV_X: ${REACTION_MAP_CLEANUP_RANGE_STDEV_X:-3}
      REACTION_MAP_CANDIDATE_RANGE_X: ${REACTION_MAP_CANDIDATE_RANGE_X:-3}
      REACTION_MAP_ZONE_WIDTH_MIN_PCT: ${REACTION_MAP_ZONE_WIDTH_MIN_PCT:-0.16}
      REACTION_MAP_ZONE_WIDTH_MAX_PCT: ${REACTION_MAP_ZONE_WIDTH_MAX_PCT:-1.25}
      REACTION_MAP_ZONE_WIDTH_AVG_MOVE_X: ${REACTION_MAP_ZONE_WIDTH_AVG_MOVE_X:-4}
      REACTION_MAP_MAX_ZONES_STORED_PER_SIDE: ${REACTION_MAP_MAX_ZONES_STORED_PER_SIDE:-4}
      REACTION_MAP_RAW_RETENTION_MS: ${REACTION_MAP_RAW_RETENTION_MS:-7200000}
      REACTION_MAP_CONTEXT_RETENTION_MS: ${REACTION_MAP_CONTEXT_RETENTION_MS:-7200000}
      REACTION_MAP_EVENT_RETENTION_MS: ${REACTION_MAP_EVENT_RETENTION_MS:-21600000}
      REACTION_MAP_STALE_ZONE_RETENTION_MS: ${REACTION_MAP_STALE_ZONE_RETENTION_MS:-21600000}
      REACTION_MAP_RETENTION_SWEEP_MS: ${REACTION_MAP_RETENTION_SWEEP_MS:-600000}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
