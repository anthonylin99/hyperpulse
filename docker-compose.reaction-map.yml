name: hyperpulse-reaction-map

services:
  reaction-map:
    build:
      context: .
      dockerfile: workers/reaction-map/Dockerfile
    image: hyperpulse-reaction-map:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:?Set NEON_DATABASE_URL to the direct Neon Postgres connection string}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:?Set NEON_DATABASE_URL_POOLING to the pooled Neon Postgres connection string}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_URL: ${POSTGRES_URL:-}
      HYPERPULSE_NETWORK: ${HYPERPULSE_NETWORK:-mainnet}
      REACTION_MAP_ASSETS: ${REACTION_MAP_ASSETS:-BTC,ETH,SOL}
      REACTION_MAP_BUCKET_MS: ${REACTION_MAP_BUCKET_MS:-60000}
      REACTION_MAP_FLUSH_MS: ${REACTION_MAP_FLUSH_MS:-15000}
      REACTION_MAP_BOOK_LEVEL_LIMIT: ${REACTION_MAP_BOOK_LEVEL_LIMIT:-40}
      REACTION_MAP_WIDE_BOOK_N_SIG_FIGS: ${REACTION_MAP_WIDE_BOOK_N_SIG_FIGS:-3,2}
      REACTION_MAP_ZONE_WINDOWS: ${REACTION_MAP_ZONE_WINDOWS:-5m,15m,1h}
      REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT: ${REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT:-0.8}
      REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD: ${REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD:-250000}
      REACTION_MAP_CLEANUP_RANGE_MIN_PCT: ${REACTION_MAP_CLEANUP_RANGE_MIN_PCT:-2}
      REACTION_MAP_CLEANUP_RANGE_MAX_PCT: ${REACTION_MAP_CLEANUP_RANGE_MAX_PCT:-35}
      REACTION_MAP_RETENTION_MS: ${REACTION_MAP_RETENTION_MS:-86400000}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
