x-database-env: &database-env
  NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
  NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:-}
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_URL: ${POSTGRES_URL:-}

services:
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: workers/market-collector/Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment:
      <<: *database-env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      <<: *database-env
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ENABLE_TRADING: "false"
      ENABLE_FACTORS: "false"
      NEXT_PUBLIC_ENABLE_TRADING: "false"
      NEXT_PUBLIC_ENABLE_FACTORS: "false"

  market-collector:
    build:
      context: .
      dockerfile: workers/market-collector/Dockerfile
    environment:
      <<: *database-env
      MARKET_COLLECTOR_ASSET_LIMIT: ${MARKET_COLLECTOR_ASSET_LIMIT:-15}
      MARKET_COLLECTOR_INTERVAL_MS: ${MARKET_COLLECTOR_INTERVAL_MS:-300000}
      MARKET_COLLECTOR_INTERVALS: ${MARKET_COLLECTOR_INTERVALS:-5m,15m,1h,1d}
      MARKET_COLLECTOR_LEVEL_INTERVALS: ${MARKET_COLLECTOR_LEVEL_INTERVALS:-15m,1h}
    restart: unless-stopped

  momentum-alerts:
    build:
      context: workers/momentum-alerts
      dockerfile: Dockerfile
    environment:
      <<: *database-env
      MOMENTUM_ALERT_INTERVAL_MS: ${MOMENTUM_ALERT_INTERVAL_MS:-300000}
      MOMENTUM_ALERT_ASSET_LIMIT: ${MOMENTUM_ALERT_ASSET_LIMIT:-45}
      MOMENTUM_ALERT_DAILY_CAP: ${MOMENTUM_ALERT_DAILY_CAP:-8}
      MOMENTUM_ALERT_STORE_DAILY_CAP: ${MOMENTUM_ALERT_STORE_DAILY_CAP:-8}
      MOMENTUM_ALERT_MAX_PER_SIGNAL_BUCKET: ${MOMENTUM_ALERT_MAX_PER_SIGNAL_BUCKET:-2}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped

  reaction-map:
    build:
      context: .
      dockerfile: workers/reaction-map/Dockerfile
    environment:
      <<: *database-env
      REACTION_MAP_ASSETS: ${REACTION_MAP_ASSETS:-all}
      REACTION_MAP_BUCKET_MS: ${REACTION_MAP_BUCKET_MS:-60000}
      REACTION_MAP_FLUSH_MS: ${REACTION_MAP_FLUSH_MS:-120000}
      REACTION_MAP_PROMOTE_MS: ${REACTION_MAP_PROMOTE_MS:-120000}
      REACTION_MAP_BOOK_FLUSH_BATCH_SIZE: ${REACTION_MAP_BOOK_FLUSH_BATCH_SIZE:-750}
      REACTION_MAP_BOOK_LEVEL_LIMIT: ${REACTION_MAP_BOOK_LEVEL_LIMIT:-40}
      REACTION_MAP_WIDE_BOOK_N_SIG_FIGS: ${REACTION_MAP_WIDE_BOOK_N_SIG_FIGS:-3,2}
      REACTION_MAP_ZONE_WINDOWS: ${REACTION_MAP_ZONE_WINDOWS:-15m,1h,4h,1d}
      REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT: ${REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT:-0.25}
      REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD: ${REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD:-250000}
      REACTION_MAP_CLEANUP_RANGE_MIN_PCT: ${REACTION_MAP_CLEANUP_RANGE_MIN_PCT:-12}
      REACTION_MAP_CLEANUP_RANGE_MAX_PCT: ${REACTION_MAP_CLEANUP_RANGE_MAX_PCT:-45}
      REACTION_MAP_CLEANUP_RANGE_STDEV_X: ${REACTION_MAP_CLEANUP_RANGE_STDEV_X:-3}
      REACTION_MAP_CANDIDATE_RANGE_X: ${REACTION_MAP_CANDIDATE_RANGE_X:-3}
      REACTION_MAP_ZONE_WIDTH_MIN_PCT: ${REACTION_MAP_ZONE_WIDTH_MIN_PCT:-0.16}
      REACTION_MAP_ZONE_WIDTH_MAX_PCT: ${REACTION_MAP_ZONE_WIDTH_MAX_PCT:-1.25}
      REACTION_MAP_ZONE_WIDTH_AVG_MOVE_X: ${REACTION_MAP_ZONE_WIDTH_AVG_MOVE_X:-4}
      REACTION_MAP_MAX_ZONES_STORED_PER_SIDE: ${REACTION_MAP_MAX_ZONES_STORED_PER_SIDE:-10}
      REACTION_MAP_RETENTION_MS: ${REACTION_MAP_RETENTION_MS:-86400000}
    restart: unless-stopped
