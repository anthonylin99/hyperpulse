services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyperpulse
      POSTGRES_PASSWORD: hyperpulse
      POSTGRES_DB: hyperpulse
    ports:
      - "15432:5432"
    volumes:
      - hyperpulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperpulse -d hyperpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: workers/market-collector/Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://hyperpulse:hyperpulse@db:5432/hyperpulse}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://hyperpulse:hyperpulse@db:5432/hyperpulse}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ENABLE_TRADING: "false"
      ENABLE_FACTORS: "false"
      NEXT_PUBLIC_ENABLE_TRADING: "false"
      NEXT_PUBLIC_ENABLE_FACTORS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully

  market-collector:
    build:
      context: .
      dockerfile: workers/market-collector/Dockerfile
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://hyperpulse:hyperpulse@db:5432/hyperpulse}
      MARKET_COLLECTOR_ASSET_LIMIT: ${MARKET_COLLECTOR_ASSET_LIMIT:-15}
      MARKET_COLLECTOR_INTERVAL_MS: ${MARKET_COLLECTOR_INTERVAL_MS:-300000}
      MARKET_COLLECTOR_INTERVALS: ${MARKET_COLLECTOR_INTERVALS:-5m,15m,1h,1d}
      MARKET_COLLECTOR_LEVEL_INTERVALS: ${MARKET_COLLECTOR_LEVEL_INTERVALS:-15m,1h}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  momentum-alerts:
    build:
      context: .
      dockerfile: workers/momentum-alerts/Dockerfile
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://hyperpulse:hyperpulse@db:5432/hyperpulse}
      MOMENTUM_ALERT_INTERVAL_MS: ${MOMENTUM_ALERT_INTERVAL_MS:-300000}
      MOMENTUM_ALERT_ASSET_LIMIT: ${MOMENTUM_ALERT_ASSET_LIMIT:-45}
      MOMENTUM_ALERT_DAILY_CAP: ${MOMENTUM_ALERT_DAILY_CAP:-8}
      MOMENTUM_ALERT_STORE_DAILY_CAP: ${MOMENTUM_ALERT_STORE_DAILY_CAP:-8}
      MOMENTUM_ALERT_MAX_PER_SIGNAL_BUCKET: ${MOMENTUM_ALERT_MAX_PER_SIGNAL_BUCKET:-2}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  reaction-map:
    build:
      context: .
      dockerfile: workers/reaction-map/Dockerfile
    environment:
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      NEON_DATABASE_URL_POOLING: ${NEON_DATABASE_URL_POOLING:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://hyperpulse:hyperpulse@db:5432/hyperpulse}
      REACTION_MAP_ASSETS: ${REACTION_MAP_ASSETS:-BTC,ETH,SOL}
      REACTION_MAP_BUCKET_MS: ${REACTION_MAP_BUCKET_MS:-60000}
      REACTION_MAP_FLUSH_MS: ${REACTION_MAP_FLUSH_MS:-15000}
      REACTION_MAP_BOOK_LEVEL_LIMIT: ${REACTION_MAP_BOOK_LEVEL_LIMIT:-40}
      REACTION_MAP_WIDE_BOOK_N_SIG_FIGS: ${REACTION_MAP_WIDE_BOOK_N_SIG_FIGS:-3,2}
      REACTION_MAP_ZONE_WINDOWS: ${REACTION_MAP_ZONE_WINDOWS:-5m,15m,1h,4h}
      REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT: ${REACTION_MAP_ZONE_CLUSTER_WIDTH_PCT:-0.12}
      REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD: ${REACTION_MAP_ZONE_MIN_TRADE_NOTIONAL_USD:-250000}
      REACTION_MAP_CLEANUP_RANGE_MIN_PCT: ${REACTION_MAP_CLEANUP_RANGE_MIN_PCT:-2}
      REACTION_MAP_CLEANUP_RANGE_MAX_PCT: ${REACTION_MAP_CLEANUP_RANGE_MAX_PCT:-35}
      REACTION_MAP_RETENTION_MS: ${REACTION_MAP_RETENTION_MS:-86400000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  hyperpulse_pg:
